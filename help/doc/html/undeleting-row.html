<body>
<div>
            <h1><img src="../image/exhelp.png" alt="code examples icon"
                 />Undeleting a Row</h1>
            <dl>
                <dt>Retrieve</dt>
                <dd>Retrieves data from the database into the DataWindow. </dd>
                <dt>Update Row</dt>
                <dd>Updates the database with any changes that were made in the
                    DataWindow. </dd>
                <dt>Delete Row</dt>
                <dd>Deletes the current row from the DataWindow. </dd>
                <dt>UnDelete Row</dt>
                <dd>Undeletes the last row that was deleted from the DataWindow.
                </dd>
            </dl>
        </div>
