</head>
<body>
<div>
            <h1><img src="../image/exhelp.png" alt="code examples icon" />Print
                Object and Print Screen</h1>
            <p>The objects on the screen are dynamically loaded into the
                ListBox. The user chooses which objects to print, and each one
                is sent to a print job using the <code>Object.Print()</code>
                function. </p>
            <p>The <code>PrintScreen()</code> function prints the entire screen
                to a print job. </p>
        </div>
</body>
